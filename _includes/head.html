{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">

{% if site.goatcounter_code and site.goatcounter_code != "" %}
<!-- Privacy-friendly analytics by GoatCounter; feeds the visitor map at /visitors/ -->
<!-- count.js is self-hosted: gc.zgo.at is unreachable from some networks, which
     silently drops those visitors. Verified byte-identical to GoatCounter's
     official count.v5.js (sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ).
     The /count endpoint it reports to is guaranteed compatible; the tradeoff is
     that updates to count.js must be pulled in by hand. -->
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
        async src="{{ base_path }}/assets/js/count.js"></script>
{% endif %}
